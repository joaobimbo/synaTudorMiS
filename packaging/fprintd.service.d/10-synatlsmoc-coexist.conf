# Install only after all standalone hardware gates pass.
[Service]
ExecStart=
# Keep the daemon alive while it owns the sensor TLS session.  fprintd's
# default idle exit does not synchronously close devices before process exit.
ExecStart=/opt/synatlsmoc-coexist/libexec/fprintd --no-timeout
Environment=LD_LIBRARY_PATH=/opt/synatlsmoc-coexist/lib/x86_64-linux-gnu:/opt/synatlsmoc-coexist/lib
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/fprint
